plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cukies.questgmsbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.cukies.questgmsbridge"
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName "4.0-iOS27-ADB-VM"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes.add('/META-INF/{AL2.0,LGPL2.1}')
            excludes.add('META-INF/DEPENDENCIES')
            excludes.add('META-INF/INDEX.LIST')
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.activity:activity-compose:1.9.0'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation:1.6.8'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Pure Kotlin ADB Client (Used to connect to 127.0.0.1:5555 like Quest Games Optimizer)
    implementation 'dev.mobile:dadb:1.2.8'

    // Hidden API Reflection Unlock for Quest 3 Horizon OS
    implementation 'com.github.tiann:FreeReflection:3.2.0'
}
